version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sentinel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sentinel_ai
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SentinelAI
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=sentinel_ai
      - CONTAMINATION_RATE=0.05
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - sentinel-network

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: sentinel-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sentinel-network

volumes:
  mongo_data:
    driver: local

networks:
  sentinel-network:
    driver: bridge
